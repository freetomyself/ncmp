name: test
on:
  schedule:
    # 每 5 分钟运行一次，使用上海时区，错开整点
    - cron: '2-59/5 * * * *'
      timezone: 'Asia/Shanghai'

    # 每天 UTC 06:25，即上海时间 14:25
    - cron: '25 6 * * *'
  workflow_dispatch:

jobs:
  check-time:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger and current time
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Triggered by cron: ${{ github.event.schedule }}"
          echo "UTC time:"
          date -u '+%Y-%m-%d %H:%M:%S UTC'
          echo "Shanghai time:"
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S Asia/Shanghai'
